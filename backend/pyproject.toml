[project]
name = "oppflow-backend"
version = "0.1.0"
description = "oppflow 后端：AI 机会发现与协作社区"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
