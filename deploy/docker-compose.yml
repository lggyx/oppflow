services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - app-data:/app/data
    environment:
      # --- 必改项 ---
      SECRET_KEY: ${SECRET_KEY:?请在 .env 里设置 SECRET_KEY}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://example.com}
      # --- 业务开关 ---
      INVITE_REQUIRED: ${INVITE_REQUIRED:-true}
      REVIEW_REQUIRED: ${REVIEW_REQUIRED:-true}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # --- AI 渠道（JSON 数组）---
      AI_CHANNELS_JSON: ${AI_CHANNELS_JSON:-}
      # --- GitHub OAuth（可选）---
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      # --- 固定项 ---
      DATABASE_URL: sqlite:////app/data/oppflow.db
      CORS_ORIGINS: ${APP_PUBLIC_BASE_URL:-https://example.com}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
